<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 300px;
      background: #030712;
      color: #f3f4f6;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #1f2937;
    }

    .logo {
      font-weight: 700;
      font-size: 15px;
      color: #34d399;
      flex: 1;
    }

    .badge {
      font-size: 10px;
      color: #6b7280;
      background: #111827;
      border: 1px solid #1f2937;
      padding: 2px 6px;
      border-radius: 99px;
    }

    #openApp {
      font-size: 11px;
      color: #4b5563;
      cursor: pointer;
      background: none;
      border: none;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s;
    }
    #openApp:hover { color: #9ca3af; }

    /* Meta row */
    .meta {
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-bottom: 1px solid #111827;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4b5563;
      flex-shrink: 0;
    }
    .dot.green  { background: #34d399; }
    .dot.red    { background: #f87171; }
    .dot.yellow { background: #fbbf24; }

    .meta-label {
      font-size: 11px;
      color: #6b7280;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .site-badge {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 99px;
      border: 1px solid;
    }
    .site-badge.supported { color: #34d399; border-color: #065f46; background: #022c22; }
    .site-badge.generic   { color: #fbbf24; border-color: #78350f; background: #1c1108; }

    /* Shortcut row */
    .shortcut-icon { font-size: 11px; flex-shrink: 0; }

    #shortcutValue {
      font-size: 11px;
      color: #6b7280;
      flex: 1;
    }
    #shortcutValue kbd {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 10px;
      font-family: inherit;
      color: #9ca3af;
    }

    #shortcutChangeBtn {
      font-size: 10px;
      color: #4b5563;
      background: none;
      border: none;
      cursor: pointer;
      padding: 1px 4px;
      border-radius: 4px;
      transition: color 0.15s;
      flex-shrink: 0;
    }
    #shortcutChangeBtn:hover { color: #9ca3af; }

    /* Shortcut instructions panel */
    #shortcutPanel {
      display: none;
      margin: 0 16px 10px;
      background: #0f172a;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 10px 12px;
      gap: 8px;
      flex-direction: column;
    }
    #shortcutPanel.open { display: flex; }

    #shortcutPanel p {
      font-size: 11px;
      color: #6b7280;
      line-height: 1.5;
    }

    .shortcut-url-row {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1f2937;
      border-radius: 6px;
      padding: 6px 8px;
    }
    .shortcut-url-row span {
      font-size: 10px;
      color: #4b5563;
      flex: 1;
      font-family: monospace;
    }
    #copyUrlBtn {
      font-size: 10px;
      color: #34d399;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      transition: color 0.15s;
    }
    #copyUrlBtn:hover { color: #6ee7b7; }

    /* Body */
    .body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #status {
      font-size: 12px;
      color: #4b5563;
      min-height: 16px;
      line-height: 1.4;
    }
    #status.success { color: #34d399; }
    #status.error   { color: #f87171; }
    #status.warn    { color: #fbbf24; }

    #viewLink {
      display: none;
      font-size: 11px;
      color: #34d399;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      text-align: left;
    }
    #viewLink:hover { color: #6ee7b7; }
    #viewLink.visible { display: inline; }

    #saveAnyway {
      display: none;
      font-size: 11px;
      color: #fbbf24;
      cursor: pointer;
      background: none;
      border: 1px solid #78350f;
      border-radius: 6px;
      padding: 5px 10px;
      width: 100%;
      text-align: center;
      transition: background 0.15s;
    }
    #saveAnyway:hover { background: #1c1108; }

    button#clipBtn {
      width: 100%;
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    button#clipBtn:hover:not(:disabled)  { background: #34d399; }
    button#clipBtn:active:not(:disabled) { background: #059669; }
    button#clipBtn:disabled { background: #1f2937; color: #4b5563; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <span class="logo">HireTree</span>
    <span class="badge">clip</span>
    <button id="openApp" title="Open HireTree">Open app ↗</button>
  </header>

  <div class="meta">
    <div class="meta-row">
      <div class="dot" id="userDot"></div>
      <span class="meta-label" id="userLabel">Checking…</span>
    </div>
    <div class="meta-row">
      <div class="dot" id="siteDot"></div>
      <span class="meta-label" id="siteLabel">Detecting page…</span>
      <span class="site-badge" id="siteBadge" style="display:none"></span>
    </div>
    <div class="meta-row">
      <span class="shortcut-icon">⌨</span>
      <span id="shortcutValue" class="meta-label">Loading…</span>
      <button id="shortcutChangeBtn">Change →</button>
    </div>
  </div>

  <!-- Shortcut instructions panel (shown when Change is clicked) -->
  <div id="shortcutPanel">
    <p>Paste this URL in Chrome's address bar, then find <strong>HireTree Clip</strong> and press your keys:</p>
    <div class="shortcut-url-row">
      <span>chrome://extensions/shortcuts</span>
      <button id="copyUrlBtn">Copy ↗</button>
    </div>
  </div>

  <div class="body">
    <button id="clipBtn" disabled>Clip this page</button>
    <p id="status"></p>
    <button id="viewLink">View saved job →</button>
    <button id="saveAnyway">Save anyway →</button>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
